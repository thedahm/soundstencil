<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Turn a voice or bark clip into a stencil-ready soundwave tattoo SVG." />
    <title>soundstencil</title>
    <script type="module" src="/src/ui/main.ts"></script>
  </head>
  <body>
    <main id="app">
      <header class="intro">
        <h1>soundstencil</h1>
        <p>Turn a voice or bark clip into a stencil-ready soundwave tattoo SVG.</p>
      </header>
      <div class="panes">
        <section class="pane" aria-labelledby="sound-heading">
          <h2 id="sound-heading">Sound</h2>
          <label class="button">
            Choose a video or audio file
            <input id="file" type="file" accept="video/*,audio/*" />
          </label>
          <p id="status" class="status" role="status"></p>
          <p id="error" class="error" role="alert" hidden></p>
          <div id="editor" hidden>
            <div id="waveform" class="waveform">
              <canvas aria-label="Waveform" role="img"></canvas>
              <div id="selection" class="selection" hidden></div>
              <div id="playhead" class="playhead" hidden></div>
              <div id="handle-start" class="handle" role="slider" tabindex="0" aria-label="Selection start" hidden></div>
              <div id="handle-end" class="handle" role="slider" tabindex="0" aria-label="Selection end" hidden></div>
            </div>
            <p id="selection-info" class="status"></p>
            <div class="controls">
              <button id="play" class="button" type="button">Loop play</button>
              <button id="zoom" class="button" type="button">Zoom to Selection</button>
              <button id="tighten" class="button" type="button">Tighten</button>
              <button id="undo" class="button" type="button">Undo</button>
              <label class="field">
                Tighten threshold
                <input id="threshold" type="number" min="-60" max="-6" step="1" value="-30" />
                dB
              </label>
            </div>
          </div>
        </section>
        <section class="pane" aria-labelledby="preview-heading">
          <h2 id="preview-heading">Preview</h2>
          <p id="preview-placeholder" class="placeholder">Your stencil will appear here.</p>
          <div id="preview" class="preview" role="img" aria-label="Stencil preview" hidden></div>
          <p id="bar-info" class="status"></p>
          <form id="design" class="design">
            <fieldset>
              <legend>Buckets</legend>
              <label class="field">
                Count
                <input id="count" type="range" min="30" max="80" step="1" value="48" />
                <output for="count"></output>
              </label>
              <label class="field">
                Compression γ
                <input id="gamma" type="range" min="0.3" max="1" step="0.05" value="0.6" />
                <output for="gamma"></output>
              </label>
              <label class="field">
                Minimum height
                <input id="floor" type="number" min="0" max="10" step="0.1" value="1" />
                mm
              </label>
              <label class="field">
                Loudness
                <select id="reduction">
                  <option value="peak" selected>Peak</option>
                  <option value="rms">RMS</option>
                </select>
              </label>
            </fieldset>
            <fieldset>
              <legend>Bars</legend>
              <label class="field">
                Fill
                <input id="fill" type="range" min="10" max="90" step="5" value="60" />
                <output for="fill"></output>
              </label>
              <label class="field">
                Rounding
                <input id="rounding" type="range" min="0" max="100" step="5" value="100" />
                <output for="rounding"></output>
              </label>
            </fieldset>
            <fieldset>
              <legend>Print Size</legend>
              <label class="field">
                Width
                <input id="width" type="number" min="1" max="50" step="0.1" value="8" />
                cm
              </label>
              <label class="field">
                Max height
                <input id="height" type="number" min="0.5" max="30" step="0.1" value="2.5" />
                cm
              </label>
            </fieldset>
          </form>
          <button id="download" class="button" type="button" disabled>Download Stencil SVG</button>
        </section>
      </div>
    </main>
    <footer>
      Runs entirely in your browser. Your file never leaves your device. No accounts, no analytics.
      <a href="https://github.com/thedahm/soundstencil/blob/main/public/_headers">Enforced by CSP</a>.
      <a href="https://github.com/thedahm/soundstencil">Source</a>.
    </footer>
  </body>
</html>
