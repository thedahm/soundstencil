name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      # Same command Workers Builds runs; also typechecks core and ui.
      - run: npm run build
      - name: CSP headers ship in dist/
        run: cmp public/_headers dist/_headers
